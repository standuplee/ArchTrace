[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "archtrace"
version = "0.1.0"
description = "Local building lifecycle lakehouse"
requires-python = ">=3.12,<3.13"
dependencies = [
  "boto3>=1.35,<2",
  "pyiceberg[pyarrow]>=0.10,<0.11",
  "python-dotenv>=1,<2",
  "pyyaml>=6,<7",
  "trino>=0.330,<0.340",
]

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.11,<1"]

[project.scripts]
archtrace = "archtrace.cli:main"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
